
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q kb3.zip
      - name: Fix keyboard CSS
        run: |
          find . -name '*.html' -not -path './.git/*' -print
          find . -name '*.html' -not -path './.git/*' -exec sed -i 's|</head>|<style>body.ime .x,body.ime #chat,body.ime #inp{display:none!important}</style></head>|' {} +
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: NeamKeyboard
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NEAM Клавиатура, сборка ${{ github.run_number }}
          files: NeamKeyboard/app/build/outputs/apk/debug/app-debug.apk
